version: 2

models:
  - name: stg_usaspending__awards
    description: >
      One row per award, per state and fiscal year it was reported for.
      Extracted from raw JSON, cast to proper types, and deduplicated
      to the latest fetch.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - award_key
              - state_code
              - fiscal_year
    columns:
      - name: award_key
        description: '{{ doc("award_key") }}'
        data_tests:
          - not_null
      - name: award_id
        description: '{{ doc("award_id") }}'
      - name: recipient_name
        description: '{{ doc("recipient_name") }}'
      - name: awarding_agency
        description: '{{ doc("awarding_agency") }}'
      - name: award_amount
        description: '{{ doc("award_amount") }}'
        data_tests:
          - not_null
      - name: start_date
        description: '{{ doc("start_date") }}'
      - name: state_code
        description: '{{ doc("state_code") }}'
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["SD", "IA", "NE", "MN", "IL"]
      - name: fiscal_year
        description: '{{ doc("fiscal_year") }}'
        data_tests:
          - not_null
      - name: award_type
        description: '{{ doc("award_type") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ["contracts", "grants"]
      - name: extracted_at
        description: '{{ doc("extracted_at") }}'
      - name: source_file
        description: '{{ doc("source_file") }}'
      - name: loaded_at
        description: '{{ doc("loaded_at") }}'

  - name: stg_usaspending__transactions
    description: >
      One row per transaction, from the latest snapshot of each state, fiscal year,
      and award type. Amounts are net obligations and can be negative (de-obligations).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              action_date between date_from_parts(fiscal_year - 1, 10, 1)
              and date_from_parts(fiscal_year, 9, 30)
    columns:
      - name: transaction_key
        description: '{{ doc("transaction_key") }}'
        data_tests:
          - unique
          - not_null
      - name: award_key
        description: '{{ doc("award_key") }}'
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_usaspending__awards')
                field: award_key
              config:
                severity: error
                warn_if: ">0"
                error_if: ">500"
      - name: award_id
        description: '{{ doc("award_id") }}'
      - name: modification_number
        description: '{{ doc("modification_number") }}'
      - name: action_date
        description: '{{ doc("action_date") }}'
        data_tests:
          - not_null
      - name: transaction_amount
        description: '{{ doc("transaction_amount") }}'
        data_tests:
          - not_null
      - name: recipient_name
        description: '{{ doc("recipient_name") }}'
      - name: recipient_uei
        description: '{{ doc("recipient_uei") }}'
      - name: awarding_agency
        description: '{{ doc("awarding_agency") }}'
      - name: awarding_sub_agency
        description: '{{ doc("awarding_sub_agency") }}'
      - name: award_type_description
        description: Award type as worded by USAspending, e.g. Definitive Contract or Project Grant.
      - name: assistance_listing_number
        description: '{{ doc("assistance_listing_number") }}'
      - name: assistance_listing_title
        description: '{{ doc("assistance_listing_title") }}'
      - name: state_code
        description: '{{ doc("state_code") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ["SD", "IA", "NE", "MN", "IL"]
      - name: fiscal_year
        description: '{{ doc("fiscal_year") }}'
      - name: award_type
        description: '{{ doc("award_type") }}'
        data_tests:
          - accepted_values:
              arguments:
                values: ["contracts", "grants"]
      - name: extracted_at
        description: '{{ doc("extracted_at") }}'
      - name: source_file
        description: '{{ doc("source_file") }}'
      - name: loaded_at
        description: '{{ doc("loaded_at") }}'
      - name: occurrence_number
        description: Position of this row among otherwise identical transactions in a snapshot; part of transaction_key.