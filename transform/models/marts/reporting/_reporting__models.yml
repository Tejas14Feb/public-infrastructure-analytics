version: 2

models:
  - name: mart_spending_by_state_sector
    description: Net obligations by fiscal year, state, and sector, split into grants and contracts. Answers business question 1.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fiscal_year
              - state_code
              - sector
    columns:
      - name: fiscal_year
        data_type: number(38,0)
        description: '{{ doc("fiscal_year") }}'
      - name: state_code
        data_type: varchar
        description: '{{ doc("state_code") }}'
      - name: state_name
        data_type: varchar
        description: '{{ doc("state_name") }}'
      - name: sector
        data_type: varchar
        description: '{{ doc("sector") }}'
      - name: transactions
        data_type: number(18,0)
        description: '{{ doc("transactions") }}'
      - name: net_obligations
        data_type: number(30,2)
        description: '{{ doc("net_obligations") }}'
      - name: grant_obligations
        data_type: number(30,2)
        description: Net obligations from grants only, in USD.
      - name: contract_obligations
        data_type: number(30,2)
        description: Net obligations from contracts only, in USD.

  - name: mart_spending_trends
    description: >
      Net obligations by sector and fiscal year, with year-over-year change, a
      Before/After label for the 2021 infrastructure bill, and a partial-year flag.
      Answers business question 2.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fiscal_year
              - sector
    columns:
      - name: fiscal_year
        data_type: number(38,0)
        description: '{{ doc("fiscal_year") }}'
      - name: sector
        data_type: varchar
        description: '{{ doc("sector") }}'
      - name: net_obligations
        data_type: number(30,2)
        description: '{{ doc("net_obligations") }}'
      - name: bill_period
        data_type: varchar
        description: Before or After the 2021 infrastructure bill (Infrastructure Investment and Jobs Act), based on fiscal year.
        data_tests:
          - accepted_values:
              arguments:
                values: [ "Before", "After" ]
      - name: prior_year_obligations
        data_type: number(30,2)
        description: Net obligations for the same sector in the previous fiscal year, in USD.
      - name: pct_change_from_prior_year
        data_type: number(38,1)
        description: Percent change in net obligations versus the prior fiscal year. Null when there is no prior year.
      - name: is_partial_year
        data_type: boolean
        description: True for the current fiscal year, which is still in progress, so its totals are incomplete.

  - name: mart_top_contract_recipients
    description: >
      Contract net obligations by recipient, state, and fiscal year, with market
      share and rank within each state and year. Answers business question 3.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - fiscal_year
              - state_code
              - recipient_uei
    columns:
      - name: fiscal_year
        data_type: number(38,0)
        description: '{{ doc("fiscal_year") }}'
      - name: state_code
        data_type: varchar
        description: '{{ doc("state_code") }}'
      - name: recipient_uei
        data_type: varchar
        description: '{{ doc("recipient_uei") }}'
      - name: recipient_name
        data_type: varchar
        description: '{{ doc("recipient_name") }}'
      - name: transactions
        data_type: number(18,0)
        description: '{{ doc("transactions") }}'
      - name: awards
        data_type: number(18,0)
        description: Number of distinct awards behind the recipient's transactions.
      - name: net_obligations
        data_type: number(30,2)
        description: '{{ doc("net_obligations") }}'
      - name: market_share_pct
        data_type: number(38,1)
        description: Recipient's share of all contract net obligations in the state and fiscal year, as a percentage.
      - name: rank_in_state_year
        data_type: number(18,0)
        description: Rank by net obligations within the state and fiscal year (1 is the largest).