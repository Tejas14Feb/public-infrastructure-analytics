# Profile used by GitHub Actions. Contains no secrets: every sensitive value
# comes from environment variables set from repository secrets.
public_infrastructure_analytics:
  target: ci
  outputs:
    ci:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: DBT_SVC
      role: TRANSFORMER
      warehouse: ANALYTICS_WH
      database: ANALYTICS_DEV
      schema: "{{ env_var('DBT_CI_SCHEMA') }}"
      private_key: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
      threads: 4
    prod:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: DBT_SVC
      role: TRANSFORMER
      warehouse: ANALYTICS_WH
      database: ANALYTICS
      schema: PROD
      private_key: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY') }}"
      private_key_passphrase: "{{ env_var('DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE') }}"
      threads: 4