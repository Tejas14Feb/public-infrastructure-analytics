name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# Deploys queue instead of cancelling, so prod is never left half-built
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: dbt deploy
    runs-on: ubuntu-latest

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      DBT_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY }}
      DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
      DBT_PROFILES_DIR: ${{ github.workspace }}/transform/ci

    defaults:
      run:
        working-directory: transform

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Install dbt packages
        run: uv run dbt deps

      - name: Build and test in prod
        run: uv run dbt build --target prod
        
      - name: Export reporting marts to CSV
        working-directory: .
        run: uv run python dashboard/export_reporting_marts.py
        env:
          DBT_SNOWFLAKE_USER: DBT_SVC
          DBT_SNOWFLAKE_ROLE: TRANSFORMER
          DBT_SNOWFLAKE_WAREHOUSE: ANALYTICS_WH

      - name: Upload reporting mart snapshot
        uses: actions/upload-artifact@v7
        with:
          name: reporting-marts-${{ github.sha }}
          path: dashboard/data/*.csv
          if-no-files-found: error

