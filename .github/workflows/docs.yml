name: dbt docs

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["dbt deploy"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --locked

      - name: Install dbt packages
        working-directory: transform
        run: uv run dbt deps

      - name: Generate docs
        working-directory: transform
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          DBT_SNOWFLAKE_PRIVATE_KEY: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY }}
          DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE: ${{ secrets.DBT_SNOWFLAKE_PRIVATE_KEY_PASSPHRASE }}
        run: uv run dbt docs generate --target prod --profiles-dir ci

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: transform/target

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4